<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#07090e">
    <title>آرشیو موسیقی اصیل و آذربایجانی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root {
            --bg: #07090e;
            --surface: rgba(255, 255, 255, 0.038);
            --surface-2: rgba(255, 255, 255, 0.068);
            --border: rgba(255, 255, 255, 0.085);
            --border-strong: rgba(255, 255, 255, 0.16);
            --copper: #E0964F;
            --copper-deep: #B96F30;
            --teal: #38B7A6;
            --rose: #f43f5e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --dock-bg: rgba(13, 16, 24, 0.88);
            --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            padding-bottom: calc(115px + env(safe-area-inset-bottom));
            position: relative;
        }

        /* پس‌زمینه زنده با بافت نرم */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
            background: radial-gradient(circle at 50% -10%, #161c2c 0%, var(--bg) 70%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.28;
            will-change: transform, opacity;
            animation: floatOrb 20s ease-in-out infinite alternate;
            transition: opacity 0.8s ease;
        }

        body.is-playing .orb { opacity: 0.42; }

        .orb-1 { width: 320px; height: 320px; background: var(--copper); top: -110px; right: -70px; }
        .orb-2 { width: 300px; height: 300px; background: var(--teal); bottom: 5%; left: -90px; animation-delay: -7s; animation-duration: 24s; }
        .orb-3 { width: 220px; height: 220px; background: var(--copper-deep); top: 42%; right: 12%; opacity: 0.16; animation-delay: -12s; animation-duration: 28s; }

        @keyframes floatOrb {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(-28px, 38px, 0) scale(1.12); }
            100% { transform: translate3d(24px, -28px, 0) scale(0.94); }
        }

        .container {
            width: 100%;
            max-width: 580px;
            margin: 0 auto;
            padding: 18px 14px 24px;
        }

        /* کارت هدر بنتو */
        .hero-bento {
            width: 100%;
            background: linear-gradient(155deg, rgba(255,255,255,0.065), rgba(255,255,255,0.018));
            border: 1px solid var(--border);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 22px 48px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-radius: 28px;
            padding: 20px 18px;
            margin-bottom: 14px;
            position: relative;
            overflow: hidden;
        }

        .hero-bento::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--copper), var(--teal), transparent);
        }

        .hero-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .vinyl-badge {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--copper), var(--teal));
            padding: 2.5px;
            flex-shrink: 0;
            box-shadow: 0 0 28px rgba(224, 150, 79, 0.28);
        }

        .vinyl-disc {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at center, #1e2433 0%, #0b0e15 65%, #191f2c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: spinSlow 14s linear infinite;
            animation-play-state: paused;
        }

        .vinyl-disc img { width: 100%; height: 100%; object-fit: cover; }
        .vinyl-disc.spinning { animation-play-state: running; }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .hero-text { flex: 1; min-width: 0; text-align: right; }

        .hero-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
            background: linear-gradient(90deg, #ffffff, #f6d7b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .hero-actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 8px;
        }

        .bento-btn {
            height: 42px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.045);
            color: var(--text);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: transform 0.2s var(--ease-smooth), background 0.2s, border-color 0.2s;
        }

        .bento-btn:active { transform: scale(0.96); }

        .bento-btn-primary {
            background: linear-gradient(135deg, var(--copper), var(--copper-deep));
            color: #080a0f;
            border: none;
            font-weight: 700;
            box-shadow: 0 8px 22px rgba(224, 150, 79, 0.28);
        }

        .bento-btn-icon { width: 42px; padding: 0; color: var(--muted); }

        /* نوار جستجو */
        .search-wrap {
            position: relative;
            margin-bottom: 12px;
        }

        .search-wrap input {
            width: 100%;
            height: 48px;
            background: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 0 42px 0 38px;
            color: var(--text);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
        }

        .search-wrap input:focus {
            border-color: rgba(224, 150, 79, 0.65);
            background: rgba(255, 255, 255, 0.065);
            box-shadow: 0 0 0 3px rgba(224, 150, 79, 0.12);
        }

        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .clear-search {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .clear-search.show { display: flex; }

        /* فیلترهای اسکرول افقی */
        .filter-chips {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 8px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .filter-chips::-webkit-scrollbar { display: none; }

        .chip {
            flex-shrink: 0;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s var(--ease-smooth);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .chip.active {
            background: rgba(224, 150, 79, 0.16);
            border-color: rgba(224, 150, 79, 0.55);
            color: var(--copper);
            font-weight: 700;
        }

        .chip-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            opacity: 0.75;
        }

        /* لیست آهنگ‌ها */
        .track-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .track-card {
            width: 100%;
            min-width: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 18px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 11px;
            cursor: pointer;
            transition: transform 0.22s var(--ease-smooth), background 0.22s, border-color 0.22s;
            overflow: hidden;
        }

        .track-card:active { transform: scale(0.985); }

        .track-card.active {
            background: linear-gradient(135deg, rgba(224, 150, 79, 0.14), rgba(56, 183, 166, 0.06));
            border-color: rgba(224, 150, 79, 0.52);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.32);
        }

        .track-thumb {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.055);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: var(--muted);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .track-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .track-thumb-overlay {
            position: absolute;
            inset: 0;
            background: rgba(7, 9, 14, 0.58);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .track-card.active .track-thumb {
            border: 1px solid rgba(224, 150, 79, 0.6);
            color: var(--copper);
        }

        .eq-bars { display: flex; align-items: flex-end; gap: 2.5px; height: 15px; }
        .eq-bar { width: 3px; background: var(--copper); border-radius: 2px; animation: eqBounce 0.7s ease-in-out infinite alternate; }
        .eq-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
        .eq-bar:nth-child(2) { height: 15px; animation-delay: 0.2s; }
        .eq-bar:nth-child(3) { height: 9px; animation-delay: 0.4s; }
        .eq-bars.paused .eq-bar { animation-play-state: paused; height: 4px; }

        @keyframes eqBounce {
            0% { height: 4px; }
            100% { height: 15px; }
        }

        .track-info { flex: 1; min-width: 0; text-align: right; }

        .track-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
            unicode-bidi: plaintext;
        }

        .track-card.active .track-title { color: var(--copper); }

        .track-artist {
            font-size: 0.75rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.18s, background 0.2s, color 0.2s;
        }

        .icon-btn:active { transform: scale(0.9); }
        .icon-btn.fav-active { color: var(--rose); background: rgba(244, 63, 94, 0.12); }
        .track-card.active .play-btn-small { background: var(--copper); color: #07090e; }

        /* اسکلت لودینگ */
        .skeleton-card {
            height: 66px;
            border-radius: 18px;
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* مینی پلیر شناور پایین صفحه */
        .mini-dock {
            position: fixed;
            bottom: calc(12px + env(safe-area-inset-bottom));
            inset-inline: 12px;
            margin-inline: auto;
            max-width: 556px;
            background: var(--dock-bg);
            border: 1px solid var(--border-strong);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 18px 45px rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(26px);
            -webkit-backdrop-filter: blur(26px);
            border-radius: 22px;
            padding: 10px 12px 12px;
            z-index: 90;
            transform: translateY(150%);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.42s var(--ease-smooth), opacity 0.3s;
            cursor: pointer;
        }

        .mini-dock.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }

        .mini-progress {
            position: absolute;
            top: 0;
            left: 16px;
            right: 16px;
            height: 2.5px;
            background: rgba(255,255,255,0.1);
            border-radius: 99px;
            overflow: hidden;
            direction: ltr;
        }

        .mini-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--copper), var(--teal));
            transition: width 0.15s linear;
        }

        .mini-row {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .mini-cover {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(224, 150, 79, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.12);
        }

        .mini-cover img { width: 100%; height: 100%; object-fit: cover; }

        .mini-meta { flex: 1; min-width: 0; text-align: right; }

        .mini-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            unicode-bidi: plaintext;
        }

        .mini-artist { font-size: 0.73rem; color: var(--copper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .mini-ctrls {
            display: flex;
            align-items: center;
            gap: 4px;
            direction: ltr;
            flex-shrink: 0;
        }

        .mini-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .mini-btn:active { transform: scale(0.88); }

        .mini-btn-play {
            background: linear-gradient(135deg, var(--copper), var(--copper-deep));
            color: #07090e;
            box-shadow: 0 4px 14px rgba(224, 150, 79, 0.35);
        }

        /* صفحه تمام‌صفحه Now Playing */
        .full-player {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(7, 9, 14, 0.94);
            backdrop-filter: blur(36px);
            -webkit-backdrop-filter: blur(36px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: calc(18px + env(safe-area-inset-top)) 22px calc(26px + env(safe-area-inset-bottom));
            transform: translateY(100%);
            transition: transform 0.45s var(--ease-smooth);
            pointer-events: none;
        }

        .full-player.open { transform: translateY(0); pointer-events: auto; }

        .fp-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        .fp-label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }

        .fp-center {
            max-width: 420px;
            width: 100%;
            margin: auto;
            text-align: center;
            padding: 16px 0;
        }

        .fp-art-wrap {
            width: min(240px, 62vw);
            height: min(240px, 62vw);
            margin: 0 auto 24px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, var(--copper), var(--teal));
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 45px rgba(224, 150, 79, 0.22);
        }

        .fp-art-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at center, #1e2433 0%, #0b0e15 68%, #181d29 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: spinSlow 18s linear infinite;
            animation-play-state: paused;
        }

        .fp-art-inner.spinning { animation-play-state: running; }
        .fp-art-inner img { width: 100%; height: 100%; object-fit: cover; }

        /* موج صوتی تزئینی */
        .wave-viz {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 22px;
            margin-bottom: 18px;
        }

        .wave-bar {
            width: 3.5px;
            height: 6px;
            border-radius: 99px;
            background: linear-gradient(180deg, var(--copper), var(--teal));
            animation: waveAnim 0.9s ease-in-out infinite alternate;
            animation-play-state: paused;
        }

        .wave-viz.playing .wave-bar { animation-play-state: running; }

        @keyframes waveAnim {
            0% { height: 5px; opacity: 0.45; }
            100% { height: 22px; opacity: 1; }
        }

        .fp-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 6px;
            unicode-bidi: plaintext;
        }

        .fp-artist { font-size: 0.9rem; color: var(--copper); }

        .fp-controls-area {
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
        }

        .fp-progress-wrap {
            width: 100%;
            padding: 10px 0;
            cursor: pointer;
            direction: ltr;
        }

        .fp-progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.14);
            border-radius: 99px;
            overflow: hidden;
        }

        .fp-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--copper), var(--teal));
            border-radius: 99px;
        }

        .fp-times {
            display: flex;
            justify-content: space-between;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.74rem;
            color: var(--muted);
            direction: ltr;
            margin-bottom: 18px;
        }

        .fp-buttons {
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr;
            margin-bottom: 16px;
        }

        .fp-btn {
            background: none;
            border: none;
            color: var(--muted);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s, color 0.2s, background 0.2s;
        }

        .fp-btn:active { transform: scale(0.9); }
        .fp-btn.active-mode { color: var(--teal); background: rgba(56, 183, 166, 0.12); }

        .fp-play-big {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--copper), var(--copper-deep));
            color: #07090e;
            box-shadow: 0 10px 28px rgba(224, 150, 79, 0.4);
        }

        .fp-footer-actions {
            display: flex;
            justify-content: space-around;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        /* پیام اعلان Toast */
        .toast {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(18, 22, 32, 0.94);
            border: 1px solid rgba(224, 150, 79, 0.45);
            backdrop-filter: blur(16px);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            z-index: 300;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            transition: transform 0.35s var(--ease-smooth);
            white-space: nowrap;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }

        .empty-state { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 0.88rem; }
    </style>
</head>
<body>

<div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="toast" id="toastEl">پیام</div>

<div class="container">
    <!-- هدر بنتو -->
    <div class="hero-bento">
        <div class="hero-top">
            <div class="vinyl-badge">
                <div class="vinyl-disc" id="heroVinyl">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E0964F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"></path>
                        <circle cx="6" cy="18" r="3"></circle>
                        <circle cx="18" cy="16" r="3"></circle>
                    </svg>
                </div>
            </div>
            <div class="hero-text">

            </a>

<audio id="audioEl" preload="metadata"></audio>

<script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRhTf54LwMPztSYcFTgQJLd8_Agf0CEPE62XktWXdb1MND3kq219aAhn9nRQY11Z_bcufVO3a0ZozVp/pub?output=csv";

    let tracks = [];
    let currentIndex = -1;
    let isShuffle = false;
    let isRepeat = false;
    let searchQuery = '';
    let activeFilter = 'ALL';
    let favorites = JSON.parse(localStorage.getItem('music_favs_v1') || '[]');

    const coverCache = {};
    const coverTried = new Set();

    const audio = document.getElementById('audioEl');
    const trackListEl = document.getElementById('trackList');
    const filterChipsEl = document.getElementById('filterChips');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const miniDock = document.getElementById('miniDock');
    const fullPlayer = document.getElementById('fullPlayer');
    const toastEl = document.getElementById('toastEl');

    const playSvg = `<polygon points="6 4 20 12 6 20 6 4"></polygon>`;
    const pauseSvg = `<rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>`;
    const defaultNoteSvg = (size) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="#E0964F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>`;

    let toastTimer;
    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    function parseCSV(text) {
        const rows = [];
        let row = [], cell = '', inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i], next = text[i + 1];
            if (inQuotes) {
                if (c === '"' && next === '"') { cell += '"'; i++; }
                else if (c === '"') { inQuotes = false; }
                else { cell += c; }
            } else {
                if (c === '"') { inQuotes = true; }
                else if (c === ',') { row.push(cell.trim()); cell = ''; }
                else if (c === '\n' || (c === '\r' && next === '\n')) {
                    row.push(cell.trim());
                    if (row.some(x => x !== '')) rows.push(row);
                    row = []; cell = '';
                    if (c === '\r') i++;
                } else { cell += c; }
            }
        }
        if (cell.length > 0 || row.length > 0) {
            row.push(cell.trim());
            if (row.some(x => x !== '')) rows.push(row);
        }
        return rows;
    }

    async function loadTracks() {
        try {
            const res = await fetch(`${SHEET_CSV_URL}&_t=${Date.now()}`);
            if (!res.ok) throw new Error('Fetch failed');
            const rows = parseCSV(await res.text());
            tracks = rows.slice(1)
                .filter(r => r[0] && r[2])
                .map((r, idx) => ({
                    id: idx + 1,
                    title: r[0],
                    artist: r[1] || 'آرشیو منتخب',
                    url: r[2]
                }));
        } catch (err) {
            trackListEl.innerHTML = `<div class="empty-state">خطا در دریافت لیست از سرور. لطفاً صفحه را رفرش کنید.</div>`;
            return;
        }
        document.getElementById('totalCount').textContent = tracks.length;
        buildFilterChips();
        renderList();
    }

    function buildFilterChips() {
        const artistCounts = {};
        tracks.forEach(t => { artistCounts[t.artist] = (artistCounts[t.artist] || 0) + 1; });
        const topArtists = Object.entries(artistCounts)
            .filter(([name, count]) => count >= 2 && name !== 'آرشیو منتخب')
            .sort((a, b) => b[1] - a[1])
            .slice(0, 6);

        let html = `
            <button class="chip ${activeFilter === 'ALL' ? 'active' : ''}" onclick="setFilter('ALL')">همه <span class="chip-count">${tracks.length}</span></button>
            <button class="chip ${activeFilter === 'FAV' ? 'active' : ''}" onclick="setFilter('FAV')">♥ علاقه‌مندی‌ها <span class="chip-count">${favorites.length}</span></button>
        `;
        topArtists.forEach(([artist, count]) => {
            const safe = artist.replace(/'/g, "\\'");
            html += `<button class="chip ${activeFilter === artist ? 'active' : ''}" onclick="setFilter('${safe}')">${artist} <span class="chip-count">${count}</span></button>`;
        });
        filterChipsEl.innerHTML = html;
    }

    window.setFilter = function(filter) {
        activeFilter = filter;
        buildFilterChips();
        renderList();
    };

    window.toggleFav = function(trackUrl, e) {
        if (e) e.stopPropagation();
        const idx = favorites.indexOf(trackUrl);
        if (idx === -1) {
            favorites.push(trackUrl);
            showToast('به علاقه‌مندی‌ها اضافه شد ♥');
        } else {
            favorites.splice(idx, 1);
            showToast('از علاقه‌مندی‌ها حذف شد');
        }
        localStorage.setItem('music_favs_v1', JSON.stringify(favorites));
        buildFilterChips();
        updateFpFavState();
        renderList();
    };

    function updateFpFavState() {
        const btn = document.getElementById('fpFavBtn');
        if (currentIndex === -1) return;
        const isFav = favorites.includes(tracks[currentIndex].url);
        btn.classList.toggle('fav-active', isFav);
        btn.querySelector('svg').setAttribute('fill', isFav ? 'currentColor' : 'none');
    }

    function formatTime(sec) {
        if (isNaN(sec) || !isFinite(sec)) return '00:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function fetchCoverArt(track) {
        if (coverTried.has(track.id) || !window.jsmediatags) return;
        coverTried.add(track.id);
        window.jsmediatags.read(track.url, {
            onSuccess: (tag) => {
                const pic = tag.tags && tag.tags.picture;
                if (pic && pic.data) {
                    const url = URL.createObjectURL(new Blob([new Uint8Array(pic.data)], { type: pic.format || 'image/jpeg' }));
                    coverCache[track.id] = url;
                    const thumb = document.getElementById(`thumb-${track.id}`);
                    if (thumb) renderList();
                    if (currentIndex !== -1 && tracks[currentIndex].id === track.id) updateCoverDisplays(url);
                }
            },
            onError: () => {}
        });
    }

    function updateCoverDisplays(coverUrl) {
        const heroVinyl = document.getElementById('heroVinyl');
        const miniCover = document.getElementById('miniCover');
        const fpArtInner = document.getElementById('fpArtInner');
        if (coverUrl) {
            heroVinyl.innerHTML = `<img src="${coverUrl}" alt="">`;
            miniCover.innerHTML = `<img src="${coverUrl}" alt="">`;
            fpArtInner.innerHTML = `<img src="${coverUrl}" alt="">`;
        } else {
            heroVinyl.innerHTML = defaultNoteSvg(26);
            miniCover.innerHTML = defaultNoteSvg(20);
            fpArtInner.innerHTML = defaultNoteSvg(64);
        }
    }

    const coverObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const t = tracks.find(x => x.id === Number(entry.target.dataset.id));
                if (t) fetchCoverArt(t);
                coverObserver.unobserve(entry.target);
            }
        });
    }, { rootMargin: '120px' });

    function renderList() {
        const filtered = tracks.filter(t => {
            const matchSearch = !searchQuery || t.title.toLowerCase().includes(searchQuery) || t.artist.toLowerCase().includes(searchQuery);
            const matchFilter = activeFilter === 'ALL'
                || (activeFilter === 'FAV' && favorites.includes(t.url))
                || t.artist === activeFilter;
            return matchSearch && matchFilter;
        });

        if (filtered.length === 0) {
            trackListEl.innerHTML = `<div class="empty-state">${activeFilter === 'FAV' ? 'هنوز آهنگی به علاقه‌مندی‌ها اضافه نکرده‌اید.' : 'هیچ آهنگی پیدا نشد.'}</div>`;
            return;
        }

        trackListEl.innerHTML = filtered.map(track => {
            const realIndex = tracks.findIndex(t => t.id === track.id);
            const isActive = realIndex === currentIndex;
            const isPlaying = isActive && !audio.paused;
            const isFav = favorites.includes(track.url);
            const downloadUrl = track.url.replace('?play', '');
            const cachedCover = coverCache[track.id];

            let thumbHtml = '';
            if (cachedCover) {
                thumbHtml = `<img src="${cachedCover}" alt="">` + (isActive ? `<div class="track-thumb-overlay"><div class="eq-bars ${isPlaying ? '' : 'paused'}"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div></div>` : '');
            } else if (isActive) {
                thumbHtml = `<div class="eq-bars ${isPlaying ? '' : 'paused'}"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>`;
            } else {
                thumbHtml = String(track.id).padStart(2, '0');
            }

            return `
                <div class="track-card ${isActive ? 'active' : ''}" data-id="${track.id}" onclick="playTrack(${realIndex})">
                    <div class="track-thumb" id="thumb-${track.id}">${thumbHtml}</div>
                    <div class="track-info">
                        <div class="track-title">${track.title}</div>
                        <div class="track-artist">${track.artist}</div>
                    </div>
                    <div class="track-actions" onclick="event.stopPropagation()">
                        <button class="icon-btn ${isFav ? 'fav-active' : ''}" onclick="toggleFav('${track.url.replace(/'/g, "\\'")}', event)" title="علاقه‌مندی">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        </button>
                        <a href="${downloadUrl}" download target="_blank" class="icon-btn" title="دانلود">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        </a>
                        <button class="icon-btn play-btn-small" onclick="playTrack(${realIndex})" title="پخش">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">${isPlaying ? pauseSvg : playSvg}</svg>
                        </button>
                    </div>
                </div>
            `;
        }).join('');

        document.querySelectorAll('.track-card').forEach(c => coverObserver.observe(c));
    }

    function updateMediaSession(track) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: track.title,
                artist: track.artist,
                album: 'پلی‌لیست اختصاصی من'
            });
            navigator.mediaSession.setActionHandler('play', () => audio.play());
            navigator.mediaSession.setActionHandler('pause', () => audio.pause());
            navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
            navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
        }
    }

    function syncPlayState() {
        const isPlaying = !audio.paused && currentIndex !== -1;
        document.body.classList.toggle('is-playing', isPlaying);
        document.getElementById('miniPlayIcon').innerHTML = isPlaying ? pauseSvg : playSvg;
        document.getElementById('fpPlayIcon').innerHTML = isPlaying ? pauseSvg : playSvg;
        document.getElementById('heroVinyl').classList.toggle('spinning', isPlaying);
        document.getElementById('fpArtInner').classList.toggle('spinning', isPlaying);
        document.getElementById('waveViz').classList.toggle('playing', isPlaying);
        renderList();
    }

    window.playTrack = function(index) {
        if (currentIndex === index) {
            audio.paused ? audio.play() : audio.pause();
        } else {
            currentIndex = index;
            const track = tracks[index];
            audio.src = track.url;
            document.getElementById('miniTitle').textContent = track.title;
            document.getElementById('miniArtist').textContent = track.artist;
            document.getElementById('fpTitle').textContent = track.title;
            document.getElementById('fpArtist').textContent = track.artist;
            document.getElementById('fpDownloadBtn').href = track.url.replace('?play', '');
            miniDock.classList.add('visible');
            updateCoverDisplays(coverCache[track.id] || null);
            updateFpFavState();
            fetchCoverArt(track);
            updateMediaSession(track);
            audio.play().catch(() => {});
        }
        syncPlayState();
    };

    function nextTrack() {
        if (!tracks.length) return;
        const nextIdx = isShuffle ? Math.floor(Math.random() * tracks.length) : (currentIndex + 1) % tracks.length;
        playTrack(nextIdx);
    }

    function prevTrack() {
        if (!tracks.length) return;
        playTrack((currentIndex - 1 + tracks.length) % tracks.length);
    }

    function togglePlayPause() {
        if (currentIndex === -1 && tracks.length) playTrack(0);
        else { audio.paused ? audio.play() : audio.pause(); }
    }

    // رویدادها
    miniDock.addEventListener('click', () => fullPlayer.classList.add('open'));
    document.getElementById('closeFpBtn').addEventListener('click', () => fullPlayer.classList.remove('open'));
    document.getElementById('miniPlayBtn').addEventListener('click', togglePlayPause);
    document.getElementById('fpPlayBtn').addEventListener('click', togglePlayPause);
    document.getElementById('miniNextBtn').addEventListener('click', nextTrack);
    document.getElementById('fpNextBtn').addEventListener('click', nextTrack);
    document.getElementById('miniPrevBtn').addEventListener('click', prevTrack);
    document.getElementById('fpPrevBtn').addEventListener('click', prevTrack);
    document.getElementById('fpFavBtn').addEventListener('click', () => { if (currentIndex !== -1) toggleFav(tracks[currentIndex].url); });

    document.getElementById('playAllBtn').addEventListener('click', () => { if (tracks.length) playTrack(0); });
    document.getElementById('shufflePlayBtn').addEventListener('click', () => {
        if (!tracks.length) return;
        isShuffle = true;
        document.getElementById('fpShuffleBtn').classList.add('active-mode');
        playTrack(Math.floor(Math.random() * tracks.length));
        showToast('پخش تصادفی فعال شد');
    });

    document.getElementById('shareSiteBtn').addEventListener('click', async () => {
        if (navigator.share) {
            navigator.share({ title: document.title, url: location.href }).catch(() => {});
        } else {
            navigator.clipboard.writeText(location.href);
            showToast('لینک سایت کپی شد');
        }
    });

    document.getElementById('fpShuffleBtn').addEventListener('click', function() {
        isShuffle = !isShuffle;
        this.classList.toggle('active-mode', isShuffle);
        showToast(isShuffle ? 'پخش تصادفی روشن شد' : 'پخش تصادفی خاموش شد');
    });

    document.getElementById('fpRepeatBtn').addEventListener('click', function() {
        isRepeat = !isRepeat;
        this.classList.toggle('active-mode', isRepeat);
        showToast(isRepeat ? 'تکرار آهنگ روشن شد' : 'تکرار آهنگ خاموش شد');
    });

    document.getElementById('fpBack10').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
    document.getElementById('fpFwd10').addEventListener('click', () => { if (audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 10); });

    searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        clearSearchBtn.classList.toggle('show', searchQuery.length > 0);
        renderList();
    });

    clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        clearSearchBtn.classList.remove('show');
        renderList();
    });

    audio.addEventListener('timeupdate', () => {
        const pct = (audio.currentTime / audio.duration) * 100 || 0;
        document.getElementById('miniProgressFill').style.width = `${pct}%`;
        document.getElementById('fpProgressFill').style.width = `${pct}%`;
        document.getElementById('fpCurrentTime').textContent = formatTime(audio.currentTime);
        document.getElementById('fpDuration').textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
        if (isRepeat) { audio.currentTime = 0; audio.play(); }
        else nextTrack();
    });

    audio.addEventListener('play', syncPlayState);
    audio.addEventListener('pause', syncPlayState);

    document.getElementById('fpProgressWrap').addEventListener('click', (e) => {
        if (!audio.duration) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        audio.currentTime = ratio * audio.duration;
    });

    loadTracks();
</script>

</body>
</html>
