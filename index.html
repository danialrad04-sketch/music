<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>آرشیو موسیقی اصیل و آذربایجانی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root {
            --bg-dark: #090b10;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.09);
            --accent: #E0964F;
            --accent-deep: #B96F30;
            --teal: #38B7A6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --player-bg: rgba(15, 18, 25, 0.94);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100dvh;
            padding-bottom: calc(145px + env(safe-area-inset-bottom));
            position: relative;
        }

        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
            background: radial-gradient(circle at 50% 0%, #141824 0%, var(--bg-dark) 75%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(85px);
            opacity: 0.3;
            will-change: transform;
            animation: floatOrb 18s ease-in-out infinite alternate;
        }

        .orb-1 { width: 280px; height: 280px; background: var(--accent); top: -80px; right: -60px; }
        .orb-2 { width: 260px; height: 260px; background: var(--teal); bottom: 12%; left: -70px; animation-delay: -6s; animation-duration: 22s; }
        .orb-3 { width: 200px; height: 200px; background: var(--accent-deep); top: 45%; right: 15%; opacity: 0.16; animation-delay: -11s; animation-duration: 25s; }

        @keyframes floatOrb {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(-25px, 35px, 0) scale(1.1); }
            100% { transform: translate3d(20px, -25px, 0) scale(0.95); }
        }

        .container {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 20px 14px 20px;
        }

        .hero-card {
            width: 100%;
            background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            border: 1px solid var(--border);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 24px;
            padding: 22px 16px;
            text-align: center;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 18%;
            right: 18%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .vinyl-wrapper {
            width: 82px;
            height: 82px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--teal));
            padding: 3px;
            box-shadow: 0 0 26px rgba(224, 150, 79, 0.28);
        }

        .vinyl-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at center, #1e222d 0%, #0d1017 65%, #191d28 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: spinSlow 14s linear infinite;
            animation-play-state: paused;
        }

        .vinyl-inner img { width: 100%; height: 100%; object-fit: cover; }
        .vinyl-inner.spinning { animation-play-state: running; }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .hero-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #fff, #f3d4b4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 0.84rem;
            color: var(--text-secondary);
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .hero-stats {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .hero-stats strong { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

        .controls-bar {
            width: 100%;
            display: flex;
            align-items: stretch;
            gap: 8px;
            margin-bottom: 14px;
        }

        .search-box { flex: 1; min-width: 0; position: relative; }

        .search-box input {
            width: 100%;
            height: 46px;
            background: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 0 38px 0 12px;
            color: var(--text-primary);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.88rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-box input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.07); }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .btn-play-all {
            height: 46px;
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            color: #0b0d12;
            border: none;
            border-radius: 14px;
            padding: 0 14px;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            font-size: 0.84rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
            white-space: nowrap;
            box-shadow: 0 6px 18px rgba(224, 150, 79, 0.25);
        }

        .btn-play-all:active { transform: scale(0.96); }

        .track-list { width: 100%; display: flex; flex-direction: column; gap: 10px; }

        .track-card {
            width: 100%;
            min-width: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 11px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            overflow: hidden;
        }

        .track-card:active { transform: scale(0.99); }

        .track-card.active {
            background: linear-gradient(135deg, rgba(224, 150, 79, 0.14), rgba(56, 183, 166, 0.06));
            border-color: rgba(224, 150, 79, 0.55);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
        }

        .track-thumb {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .track-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .track-thumb-overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 11, 16, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .track-card.active .track-thumb { border: 1px solid rgba(224, 150, 79, 0.6); color: var(--accent); }

        .eq-bars { display: flex; align-items: flex-end; gap: 2.5px; height: 14px; }
        .eq-bar { width: 3px; background: var(--accent); border-radius: 2px; animation: eqBounce 0.75s ease-in-out infinite alternate; }
        .eq-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
        .eq-bar:nth-child(2) { height: 14px; animation-delay: 0.2s; }
        .eq-bar:nth-child(3) { height: 9px; animation-delay: 0.4s; }
        .eq-bars.paused .eq-bar { animation-play-state: paused; height: 4px; }

        @keyframes eqBounce {
            0% { height: 4px; }
            100% { height: 14px; }
        }

        .track-info { flex: 1; min-width: 0; overflow: hidden; text-align: right; }

        .track-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
            unicode-bidi: plaintext;
        }

        .track-card.active .track-title { color: var(--accent); }

        .track-artist {
            font-size: 0.76rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

        .icon-btn {
            width: 35px;
            height: 35px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }

        .icon-btn:active { transform: scale(0.93); }
        .track-card.active .play-btn-small { background: var(--accent); color: #090b10; }

        .player-dock {
            position: fixed;
            bottom: calc(12px + env(safe-area-inset-bottom));
            inset-inline: 12px;
            margin-inline: auto;
            max-width: 536px;
            background: var(--player-bg);
            border: 1px solid rgba(255, 255, 255, 0.13);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-radius: 22px;
            padding: 13px 16px 14px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.7);
            z-index: 100;
            transform: translateY(150%);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s;
        }

        .player-dock.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }

        .player-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }

        .dock-cover {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            display: none;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .dock-cover.show { display: block; }
        .player-meta { min-width: 0; flex: 1; text-align: right; }

        .player-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            unicode-bidi: plaintext;
        }

        .player-artist { font-size: 0.74rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-secondary);
            direction: ltr;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .progress-wrap { width: 100%; height: 18px; display: flex; align-items: center; cursor: pointer; direction: ltr; margin-bottom: 8px; }
        .progress-track { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.14); border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--teal)); border-radius: 99px; transition: width 0.1s linear; }

        .player-controls { display: flex; align-items: center; justify-content: space-between; max-width: 280px; margin: 0 auto; direction: ltr; }

        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, color 0.2s;
        }

        .ctrl-btn:active { transform: scale(0.9); }
        .ctrl-btn.active-mode { color: var(--teal); }

        .ctrl-play-main {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            color: #090b10;
            box-shadow: 0 6px 16px rgba(224, 150, 79, 0.35);
        }

        .empty-state { text-align: center; padding: 36px 16px; color: var(--text-secondary); font-size: 0.88rem; }

        @media (max-width: 360px) {
            .container { padding: 14px 10px; }
            .track-card { padding: 9px 10px; gap: 8px; }
            .track-thumb { width: 38px; height: 38px; font-size: 0.72rem; }
            .icon-btn { width: 32px; height: 32px; }
            .btn-play-all { padding: 0 10px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="container">
    <div class="hero-card">
        <div class="vinyl-wrapper">
            <div class="vinyl-inner" id="vinylDisc">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E0964F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
            </div>
        </div>
        <h1 class="hero-title">پلی‌لیست اختصاصی من</h1>
        <p class="hero-subtitle">مجموعه منتخب موسیقی‌های اصیل، موغام و آذربایجانی</p>
        <div class="hero-stats">
            <span>تعداد ترک‌ها: <strong id="totalCount">...</strong></span>
            <span>•</span>
            <span>پخش آنلاین و دانلود</span>
        </div>
    </div>

    <div class="controls-bar">
        <div class="search-box">
            <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="جستجو در آهنگ یا خواننده...">
        </div>
        <button class="btn-play-all" id="playAllBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            پخش همه
        </button>
    </div>

    <div class="track-list" id="trackList">
        <div class="empty-state">در حال بارگذاری لیست آهنگ‌ها...</div>
    </div>
</div>

<div class="player-dock" id="playerDock">
    <div class="player-header">
        <img id="dockCover" class="dock-cover" alt="Cover">
        <div class="player-meta">
            <div class="player-title" id="dockTitle">انتخاب آهنگ</div>
            <div class="player-artist" id="dockArtist">آرشیو موسیقی</div>
        </div>
        <div class="player-time" id="dockTime">00:00 / 00:00</div>
    </div>

    <div class="progress-wrap" id="progressWrap">
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="player-controls">
        <button class="ctrl-btn" id="shuffleBtn" title="پخش تصادفی">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line>
                <polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line>
                <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
        </button>

        <button class="ctrl-btn" id="prevBtn" title="آهنگ قبلی">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
        </button>

        <button class="ctrl-btn ctrl-play-main" id="mainPlayBtn" title="پخش / توقف">
            <svg id="mainPlayIcon" width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
        </button>

        <button class="ctrl-btn" id="nextBtn" title="آهنگ بعدی">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
        </button>

        <button class="ctrl-btn" id="repeatBtn" title="تکرار آهنگ">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                <polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
        </button>
    </div>
</div>

<audio id="audioEl" preload="metadata"></audio>

<script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRhTf54LwMPztSYcFTgQJLd8_Agf0CEPE62XktWXdb1MND3kq219aAhn9nRQY11Z_bcufVO3a0ZozVp/pub?output=csv";

    const fallbackTracks = [
        { id: 1, title: "Könlümdə həzin bir sevgi ağlayır", artist: "Segah Muğamı", url: "https://s21.uupload.ir/files/danialradmo/music/Könlümdə%20həzin%20bir%20sevgi%20ağlayır%20(Segah%20muğamı).mp3?play" },
        { id: 2, title: "ترک ویژه ۱ (5976293494547815657)", artist: "آرشیو منتخب", url: "https://s21.uupload.ir/files/danialradmo/music/4_5976293494547815657.m4a?play" },
        { id: 3, title: "Ayrılıq (آیریلیق)", artist: "موسیقی اصیل", url: "https://s21.uupload.ir/files/danialradmo/music/Ayrılıq.mp3?play" }
    ];

    let tracks = [];
    const audio = document.getElementById('audioEl');
    const trackListEl = document.getElementById('trackList');
    const searchInput = document.getElementById('searchInput');
    const playerDock = document.getElementById('playerDock');
    const dockTitle = document.getElementById('dockTitle');
    const dockArtist = document.getElementById('dockArtist');
    const dockCover = document.getElementById('dockCover');
    const dockTime = document.getElementById('dockTime');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const mainPlayBtn = document.getElementById('mainPlayBtn');
    const mainPlayIcon = document.getElementById('mainPlayIcon');
    const vinylDisc = document.getElementById('vinylDisc');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const repeatBtn = document.getElementById('repeatBtn');

    let currentIndex = -1;
    let isShuffle = false;
    let isRepeat = false;
    let searchQuery = '';

    const coverCache = {};
    const coverTried = new Set();

    const playSvg = `<polygon points="6 4 20 12 6 20 6 4"></polygon>`;
    const pauseSvg = `<rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect>`;
    const defaultVinylSvg = `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E0964F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>`;

    function parseCSV(text) {
        const rows = [];
        let row = [], cell = '', inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i], next = text[i + 1];
            if (inQuotes) {
                if (c === '"' && next === '"') { cell += '"'; i++; }
                else if (c === '"') { inQuotes = false; }
                else { cell += c; }
            } else {
                if (c === '"') { inQuotes = true; }
                else if (c === ',') { row.push(cell.trim()); cell = ''; }
                else if (c === '\n' || (c === '\r' && next === '\n')) {
                    row.push(cell.trim());
                    if (row.some(x => x !== '')) rows.push(row);
                    row = []; cell = '';
                    if (c === '\r') i++;
                } else { cell += c; }
            }
        }
        if (cell.length > 0 || row.length > 0) {
            row.push(cell.trim());
            if (row.some(x => x !== '')) rows.push(row);
        }
        return rows;
    }

    async function loadTracks() {
        try {
            const res = await fetch(`${SHEET_CSV_URL}&_t=${Date.now()}`);
            if (!res.ok) throw new Error('Sheet fetch failed');
            const csvText = await res.text();
            const rows = parseCSV(csvText);

            const parsed = rows.slice(1)
                .filter(r => r[0] && r[2])
                .map((r, idx) => ({
                    id: idx + 1,
                    title: r[0],
                    artist: r[1] || 'آرشیو منتخب',
                    url: r[2]
                }));

            tracks = parsed.length > 0 ? parsed : fallbackTracks;
        } catch (err) {
            console.warn('Using fallback tracks:', err);
            tracks = fallbackTracks;
        }
        document.getElementById('totalCount').textContent = tracks.length;
        renderList();
    }

    function formatTime(sec) {
        if (isNaN(sec) || !isFinite(sec)) return '00:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function fetchCoverArt(track) {
        if (coverTried.has(track.id) || !window.jsmediatags) return;
        coverTried.add(track.id);

        window.jsmediatags.read(track.url, {
            onSuccess: function(tag) {
                const picture = tag.tags && tag.tags.picture;
                if (picture && picture.data) {
                    const blob = new Blob([new Uint8Array(picture.data)], { type: picture.format || 'image/jpeg' });
                    const imageUrl = URL.createObjectURL(blob);
                    coverCache[track.id] = imageUrl;

                    const thumbEl = document.getElementById(`thumb-${track.id}`);
                    if (thumbEl) {
                        const isActive = currentIndex !== -1 && tracks[currentIndex].id === track.id;
                        const isPlaying = isActive && !audio.paused;
                        thumbEl.innerHTML = `<img src="${imageUrl}" alt="">` + (isActive ? `
                            <div class="track-thumb-overlay">
                                <div class="eq-bars ${isPlaying ? '' : 'paused'}">
                                    <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                                </div>
                            </div>` : '');
                    }
                    if (currentIndex !== -1 && tracks[currentIndex].id === track.id) {
                        updateActiveCovers(imageUrl);
                    }
                }
            },
            onError: function() {}
        });
    }

    function updateActiveCovers(coverUrl) {
        if (coverUrl) {
            dockCover.src = coverUrl;
            dockCover.classList.add('show');
            vinylDisc.innerHTML = `<img src="${coverUrl}" alt="Cover">`;
        } else {
            dockCover.classList.remove('show');
            vinylDisc.innerHTML = defaultVinylSvg;
        }
    }

    const coverObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const track = tracks.find(t => t.id === Number(entry.target.dataset.id));
                if (track) fetchCoverArt(track);
                coverObserver.unobserve(entry.target);
            }
        });
    }, { rootMargin: '120px' });

    function renderList() {
        const filtered = tracks.filter(t =>
            t.title.toLowerCase().includes(searchQuery) ||
            t.artist.toLowerCase().includes(searchQuery)
        );

        if (filtered.length === 0) {
            trackListEl.innerHTML = `<div class="empty-state">هیچ آهنگی با این نام پیدا نشد.</div>`;
            return;
        }

        trackListEl.innerHTML = filtered.map(track => {
            const realIndex = tracks.findIndex(t => t.id === track.id);
            const isActive = realIndex === currentIndex;
            const isPlaying = isActive && !audio.paused;
            const downloadUrl = track.url.replace('?play', '');
            const cachedCover = coverCache[track.id];

            let thumbContent = '';
            if (cachedCover) {
                thumbContent = `<img src="${cachedCover}" alt="">` + (isActive ? `
                    <div class="track-thumb-overlay">
                        <div class="eq-bars ${isPlaying ? '' : 'paused'}">
                            <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                        </div>
                    </div>` : '');
            } else if (isActive) {
                thumbContent = `
                    <div class="eq-bars ${isPlaying ? '' : 'paused'}">
                        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                    </div>`;
            } else {
                thumbContent = String(track.id).padStart(2, '0');
            }

            return `
                <div class="track-card ${isActive ? 'active' : ''}" data-id="${track.id}" onclick="playTrack(${realIndex})">
                    <div class="track-thumb" id="thumb-${track.id}">${thumbContent}</div>
                    <div class="track-info">
                        <div class="track-title">${track.title}</div>
                        <div class="track-artist">${track.artist}</div>
                    </div>
                    <div class="track-actions" onclick="event.stopPropagation()">
                        <a href="${downloadUrl}" download target="_blank" class="icon-btn" title="دانلود">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                        </a>
                        <button class="icon-btn play-btn-small" onclick="playTrack(${realIndex})" title="پخش">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                                ${isPlaying ? pauseSvg : playSvg}
                            </svg>
                        </button>
                    </div>
                </div>
            `;
        }).join('');

        document.querySelectorAll('.track-card').forEach(card => coverObserver.observe(card));
    }

    function updatePlayerUI() {
        const isPlaying = !audio.paused && currentIndex !== -1;
        mainPlayIcon.innerHTML = isPlaying ? pauseSvg : playSvg;
        vinylDisc.classList.toggle('spinning', isPlaying);
        renderList();
    }

    window.playTrack = function(index) {
        if (currentIndex === index) {
            audio.paused ? audio.play() : audio.pause();
        } else {
            currentIndex = index;
            const track = tracks[index];
            audio.src = track.url;
            dockTitle.textContent = track.title;
            dockArtist.textContent = track.artist;
            playerDock.classList.add('visible');
            updateActiveCovers(coverCache[track.id] || null);
            fetchCoverArt(track);
            audio.play().catch(err => console.log('Playback error:', err));
        }
        updatePlayerUI();
    };

    function nextTrack() {
        if (!tracks.length) return;
        const nextIdx = isShuffle ? Math.floor(Math.random() * tracks.length) : (currentIndex + 1) % tracks.length;
        playTrack(nextIdx);
    }

    function prevTrack() {
        if (!tracks.length) return;
        playTrack((currentIndex - 1 + tracks.length) % tracks.length);
    }

    mainPlayBtn.addEventListener('click', () => {
        if (currentIndex === -1) playTrack(0);
        else { audio.paused ? audio.play() : audio.pause(); updatePlayerUI(); }
    });

    document.getElementById('nextBtn').addEventListener('click', nextTrack);
    document.getElementById('prevBtn').addEventListener('click', prevTrack);
    document.getElementById('playAllBtn').addEventListener('click', () => playTrack(0));
    shuffleBtn.addEventListener('click', () => { isShuffle = !isShuffle; shuffleBtn.classList.toggle('active-mode', isShuffle); });
    repeatBtn.addEventListener('click', () => { isRepeat = !isRepeat; repeatBtn.classList.toggle('active-mode', isRepeat); });
    searchInput.addEventListener('input', (e) => { searchQuery = e.target.value.trim().toLowerCase(); renderList(); });

    audio.addEventListener('timeupdate', () => {
        const pct = (audio.currentTime / audio.duration) * 100 || 0;
        progressFill.style.width = `${pct}%`;
        dockTime.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    });

    audio.addEventListener('ended', () => {
        if (isRepeat) { audio.currentTime = 0; audio.play(); }
        else nextTrack();
    });

    audio.addEventListener('play', updatePlayerUI);
    audio.addEventListener('pause', updatePlayerUI);

    progressWrap.addEventListener('click', (e) => {
        if (!audio.duration) return;
        const rect = progressWrap.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        audio.currentTime = ratio * audio.duration;
    });

    loadTracks();
</script>

</body>
</html>
